<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B8AF0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PanelLayout">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Metal Panel Layout Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0F1117; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    input, select, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1A1D27; }
    ::-webkit-scrollbar-thumb { background: #2E3345; border-radius: 3px; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    LOAD ORDER MATTERS — each file depends on the ones above it.
    All scripts share the same global scope via Babel.

    colors.js      → theme constants + DEFAULT_PROFILES (no deps)
    measurement.js → formatter + parser (no deps)
    engine.js      → layout math + gable + openings + buildPanelRow + export (depends on measurement)
    numpad.js      → numpad state + overlay + MeasurementInput (depends on measurement, colors)
    components.js  → Button, Card, TabBar, LayoutCanvas, OpeningEditor (depends on colors, measurement, numpad)
    walls.js       → WallEditor, CutListDisplay, ProfileManager (depends on everything above)
    app.js         → main App + ReactDOM mount (depends on everything above)
  -->

  <!-- React hooks — available to all scripts below -->
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
  </script>

  <!-- 1. Theme + defaults -->
  <script type="text/babel" src="js/colors.js"></script>

  <!-- 2. Measurement system -->
  <script type="text/babel" src="js/measurement.js"></script>

  <!-- 3. Math engine -->
  <script type="text/babel" src="js/engine.js"></script>

  <!-- 4. Custom numpad -->
  <script type="text/babel" src="js/numpad.js"></script>

  <!-- 5. UI primitives + canvas -->
  <script type="text/babel" src="js/components.js"></script>

  <!-- 6. Wall editor + cut list + profile manager -->
  <script type="text/babel" src="js/walls.js"></script>

  <!-- 7. Main app + mount -->
  <script type="text/babel" src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
